# ALTERNATIVE FIX (If 5432 fails): Port 6543 (Transaction Mode). MUST include ?pgbouncer=true
# spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true

# ==========================================
# 📉 CONNECTION POOL LIMITS (HIKARI)
# ==========================================
# CRITICAL FIX: Stops Spring Boot from hogging all 60 Supabase free-tier connections
spring.datasource.hikari.maximum-pool-size=5

# TIMEOUT FIX: Tells Spring to wait 40 seconds before crashing if Supabase is slow to wake up
spring.datasource.hikari.connection-timeout=40000

# Fixes a minor warning with the Supabase pooler
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ==========================================
# 🏗️ HIBERNATE & TABLE CREATION
# ==========================================
# Auto-creates or updates your tables based on your Java code (Use for local testing)
spring.jpa.hibernate.ddl-auto=update

# PRODUCTION FIX: Change to 'none' or 'validate' when real users are using the app!
# spring.jpa.hibernate.ddl-auto=none

# ==========================================
# 🚀 PERFORMANCE TWEAKS
# ==========================================
# MEMORY FIX: Stops Spring from keeping database connections open longer than necessary
spring.jpa.open-in-view=false

